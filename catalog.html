<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — Аружан Flowers</title>
  <meta name="description" content="Букеты, мягкие мишки и воздушные шары. Цены в тенге, заказ в WhatsApp.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:title" content="Каталог — Аружан Flowers">
  <meta property="og:description" content="Букеты, мягкие мишки и воздушные шары. Цены в тенге, заказ в WhatsApp.">
  <meta property="og:image" content="images/og.jpg">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="catalog">
<!-- Шапка, подвал и корзина вставляются из script.js -->
  <main>
    <section class="catalog page-top">
      <h1 class="page-title">Каталог</h1>
      <div class="filters" id="filters"></div>
      <div class="sort-row">
        <label for="sort">Сортировать:</label>
        <select id="sort" class="sort">
          <option value="rec">Рекомендуем вам</option>
          <option value="cheap">Сначала дешевле</option>
          <option value="expensive">Сначала дороже</option>
        </select>
      </div>
      <div class="grid" id="products"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
