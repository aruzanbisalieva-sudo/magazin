<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аружан Flowers — доставка цветов</title>
  <meta name="description" content="Аружан Flowers — красивые букеты, мишки и шары. Самовывоз и курьер. Заказ в WhatsApp.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:title" content="Аружан Flowers — доставка цветов">
  <meta property="og:description" content="Аружан Flowers — красивые букеты, мишки и шары. Самовывоз и курьер. Заказ в WhatsApp.">
  <meta property="og:image" content="images/og.jpg">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
<!-- Шапка, подвал и корзина вставляются из script.js -->
  <main>
    <section class="hero">
      <div class="hero-text">
        <p class="hero-sub">Цветочный магазин</p>
        <h1>Аружан <span>Flowers</span></h1>
        <p class="hero-desc">Нежные букеты из свежих цветов для любимых. Соберём с любовью и доставим вовремя.</p>
        <div class="hero-btns">
          <a href="catalog.html" class="btn">Выбрать букет</a>
          <a href="delivery.html" class="btn btn-ghost">Доставка</a>
        </div>
      </div>
      <div class="hero-img">
        <img src="images/hero-red.jpg" alt="Красный букет роз">
      </div>
    </section>

    <section class="catalog">
      <h2>Популярное</h2>
      <div class="grid grid-4" id="popular"></div>
      <div class="center"><a href="catalog.html" class="btn btn-ghost">Весь каталог →</a></div>
    </section>

    <section class="cats">
      <a href="catalog.html?cat=flowers" class="cat-tile"><img src="images/b2.jpg" alt=""><span>Букеты</span></a>
      <a href="catalog.html?cat=bears" class="cat-tile"><img src="images/bear-hearts.jpg" alt=""><span>Мишки</span></a>
      <a href="catalog.html?cat=balloons" class="cat-tile"><img src="images/balloons-pink.jpg" alt=""><span>Шары</span></a>
    </section>

    <section class="promo">
      <h2>Наша реклама</h2>
      <div class="promo-video">
        <video controls playsinline preload="metadata" poster="images/reklama-poster.jpg">
          <source src="reklama.mp4" type="video/mp4">
          Ваш браузер не поддерживает видео.
        </video>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
